name: Exp109 lossless exploratory
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/exp109/**'
      - '.github/workflows/exp109.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pillow==12.3.0 scikit-image==0.26.0 numpy==2.3.5 brotli==1.2.0
      - run: cd research/exp109 && python -m unittest -v test_exp109.py
      - run: cd research/exp109 && python bench.py > results.json && cat results.json
