name: exp65 hybrid lossless DEM Pareto study

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/universe/experiment_65_hybrid_pareto.py"
      - ".github/workflows/exp65.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/universe/experiment_65_hybrid_pareto.py"
      - ".github/workflows/exp65.yml"
  workflow_dispatch:

jobs:
  tradeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install codec dependencies
        run: python -m pip install numpy pillow brotli rasterio
      - name: Verify parse and corruption checks
        run: |
          python -m py_compile research/universe/experiment_65_hybrid_pareto.py
          python research/universe/experiment_65_hybrid_pareto.py \
            --self-test --out /tmp/blkh_exp65_selftest
      - name: Benchmark 6 known real geographic sources at four tradeoffs
        run: |
          python research/universe/experiment_65_hybrid_pareto.py \
            --out /tmp/blkh_exp65
      - name: Independently audit full source reconstruction and Pareto rows
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys,numpy as np
          sys.path.insert(0, "research/universe")
          from experiment_65_hybrid_pareto import OpenHybrid, LEVELS
          from experiment_60_geotiff_roi import REGIONS
          root=pathlib.Path("/tmp/blkh_exp65")
          d=json.loads((root/"results.json").read_text())
          assert len(d["results"])==6
          assert len(d["thresholds"])==4
          assert {r["region"] for r in d["results"]}==set(REGIONS)
          for r in d["results"]:
              assert r["lossless_verified"]
              records=r["versions"]
              assert set(records)=={"0.00","0.15","0.20","0.25"}
              fast=[]
              sizes=[]
              for threshold in LEVELS:
                  name=f"{threshold:.2f}"
                  row=records[name]
                  path=root/r["region"]/row["file"]
                  payload=path.read_bytes()
                  assert len(payload)==row["size_bytes"]
                  assert hashlib.sha256(payload).hexdigest()==row["sha256"]
                  assert row["chosen_fast_blocks"]+row["chosen_compact_blocks"]==64
                  assert row["roi_reads"]==192
                  assert row["all_true_cache_misses"] and row["roi_mean_ms"]>0
                  fast.append(row["chosen_fast_blocks"])
                  sizes.append(row["size_bytes"])
                  with OpenHybrid(path) as reader:
                      assert reader.metadata==r["geospatial"]
                      pixels=np.empty((256,256),dtype=np.int16)
                      for y in range(8):
                          for x in range(8):
                              pixels[y*32:(y+1)*32,x*32:(x+1)*32]=reader.read(y,x)
                      assert hashlib.sha256(pixels.tobytes()).hexdigest()==r["source_sha256"]
              assert fast==sorted(fast)
              assert sizes==sorted(sizes)
              print(r["region"],"fast block counts",fast,
                    "bytes",sizes,
                    "ms",[round(records[f"{x:.2f}"]["roi_mean_ms"],4) for x in LEVELS])
          print("EXP65 VERIFIED: 6 EXACT REAL DEMS x 4 MIXED-BLOCK CODEC CHOICES")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp65-hybrid-dem-pareto
          path: |
            /tmp/blkh_exp65/
            /tmp/blkh_exp65_selftest/
          retention-days: 30
