name: exp51 research reproducibility

on:
  push:
    branches: [research/exp51-fair-shared-siren]
  pull_request:
    branches: [main]
    paths:
      - "research/universe/experiment_51_fair_sharing.py"
      - "research/universe/experiment_52_holdout_latent.py"
      - "research/universe/experiment_53_real_lunar_tiles.py"
      - ".github/workflows/exp51.yml"
  workflow_dispatch:

jobs:
  exp51-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install experimental dependencies
        run: |
          python -m pip install numpy torch scikit-image scikit-learn pillow
      - name: Check Python syntax
        run: python -m py_compile research/universe/experiment_51_fair_sharing.py
      - name: Round-trip self-test
        run: python research/universe/experiment_51_fair_sharing.py --self-test
      - name: Reproducible smoke comparison
        run: |
          python research/universe/experiment_51_fair_sharing.py             --size 16 --count 6 --widths 8 --k 1,3             --epochs 15 --seeds 42 --out /tmp/exp51-smoke
      - name: Exercise smooth procedural family + real image-codec decoding
        run: |
          python research/universe/experiment_51_fair_sharing.py \
            --dataset smooth --size 16 --count 6 --widths 8 --k 1 \
            --epochs 15 --seeds 42 --compare-codecs \
            --out /tmp/exp51-smooth-smoke
          python - <<'PY'
          import json, pathlib, math
          out = pathlib.Path('/tmp/exp51-smooth-smoke/results.json')
          report = json.loads(out.read_text())
          assert report['dataset'] == 'smooth'
          assert len(report['results']) == 2
          assert all(x['verified_post_decode'] for x in report['results'])
          baselines = report['codec_baselines']
          assert {b['codec'] for b in baselines} == {'PNG', 'JPEG', 'WEBP'}
          assert all(b['bytes'] > 0 and math.isfinite(b['mean_psnr_db']) for b in baselines)
          print('PASS: procedural corpus, neural decode and 3 decoded image-codec baselines')
          PY
      - name: Exp 52 held-out latent adaptation smoke
        run: |
          python -m py_compile research/universe/experiment_52_holdout_latent.py
          python research/universe/experiment_52_holdout_latent.py \
            --size 16 --count 6 --width 8 --epochs 15 \
            --adapt-epochs 15 --seeds 42 --out /tmp/exp52-smoke
          python - <<'PY'
          import json, pathlib, math
          root = pathlib.Path('/tmp/exp52-smoke')
          rec = json.loads((root/'results.json').read_text())['results'][0]
          assert rec['verified_post_decode'] is True
          assert rec['backbone_frozen_during_adaptation'] is True
          assert rec['encoder_uses_heldout_pixels_to_optimize_latent'] is True
          assert rec['total_bytes_with_new_image'] > 0
          assert math.isfinite(rec['heldout_psnr_db'])
          assert (root/rec['full_file']).stat().st_size == rec['total_bytes_with_new_image']
          assert (root/rec['base_file']).stat().st_size == rec['total_bytes_without_new_image']
          print('PASS: frozen-backbone latent-only adaptation and full roundtrip')
          PY
      - name: Controlled full-size synthetic comparison
        run: |
          python research/universe/experiment_51_fair_sharing.py \
            --dataset smooth --size 64 --count 6 --widths 16 --k 1 \
            --epochs 600 --seeds 42,123 --compare-codecs \
            --out /tmp/exp51-full-smooth
          python research/universe/experiment_52_holdout_latent.py \
            --size 64 --count 6 --width 16 --epochs 600 \
            --adapt-epochs 600 --seeds 42,123 \
            --out /tmp/exp52-full-smooth
      - name: Verify large-run saved models and metrics
        run: |
          python - <<'PY'
          import json, math, pathlib
          dirs = [pathlib.Path('/tmp/exp51-full-smooth'), pathlib.Path('/tmp/exp52-full-smooth')]
          a = json.loads((dirs[0]/'results.json').read_text())
          b = json.loads((dirs[1]/'results.json').read_text())
          assert len(a['results']) == 4 and len(b['results']) == 2
          for rec in a['results']:
              assert rec['verified_post_decode'] is True
              assert (dirs[0]/rec['encoded_file']).stat().st_size == rec['bytes']
              assert math.isfinite(rec['mean_psnr_db'])
          for rec in b['results']:
              assert rec['verified_post_decode'] is True
              assert (dirs[1]/rec['full_file']).stat().st_size == rec['total_bytes_with_new_image']
              assert math.isfinite(rec['heldout_psnr_db'])
          assert any(x['codec'] == 'WEBP' for x in a['codec_baselines'])
          print('PASS: Exp 51/52 large-run serialization and decoded metrics')
          PY
      - name: Test Exp 53 on real lunar image tiles
        run: |
          python -m py_compile research/universe/experiment_53_real_lunar_tiles.py
          python research/universe/experiment_53_real_lunar_tiles.py \
            --epochs 300 --width 16 --seeds 42,123 \
            --out /tmp/exp53-real-lunar
          python - <<'PY'
          import json, pathlib, math
          root = pathlib.Path('/tmp/exp53-real-lunar')
          j = json.loads((root/'results.json').read_text())
          assert len(j['results']) == 4
          assert any(x['codec'] == 'WEBP' for x in j['codec_baselines'])
          for r in j['results']:
              assert r['verified_post_decode']
              assert (root/r['encoded_file']).stat().st_size == r['bytes']
              assert math.isfinite(r['mean_psnr_db'])
          print('PASS: Exp 53 real lunar tile codecs and neural roundtrip')
          PY
      - name: Verify JSON evidence
        run: |
          python - <<'PY'
          import json, math, pathlib
          root = pathlib.Path('/tmp/exp51-smoke')
          payload = json.loads((root/'results.json').read_text())
          runs = payload['results']
          assert len(runs) == 3, len(runs)
          assert all(r['verified_post_decode'] for r in runs)
          assert all(math.isfinite(r['mean_psnr_db']) for r in runs)
          assert all((root/r['encoded_file']).stat().st_size == r['bytes'] for r in runs)
          assert runs[0]['actual_shared_images'] == 0
          assert all(2 <= r['actual_shared_images'] <= 6 for r in runs[1:])
          assert all(sum(r['group_sizes']) == 6 for r in runs)
          print('Verified experiment outputs:', json.dumps([
            {k:r[k] for k in ('mode','k','bytes','bpp','mean_psnr_db','actual_shared_images')}
            for r in runs
          ], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp51-smoke-artifacts
          path: |
            /tmp/exp51-smoke/
            /tmp/exp51-smooth-smoke/
            /tmp/exp52-smoke/
            /tmp/exp51-full-smooth/
            /tmp/exp52-full-smooth/
            /tmp/exp53-real-lunar/
          retention-days: 14
