name: BLKH Exp116 reproducibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/exp116/**'
      - '.github/workflows/exp116.yml'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 Pillow==12.3.0
      - run: python research/exp116/experiment.py > exp116-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exp116-results
          path: exp116-results.txt
