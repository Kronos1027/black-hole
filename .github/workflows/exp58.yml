name: exp58 vectorized reversible DEM decoding

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/universe/experiment_58_vectorized_decoder.py"
      - ".github/workflows/exp58.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/universe/experiment_58_vectorized_decoder.py"
      - ".github/workflows/exp58.yml"
  workflow_dispatch:

jobs:
  fast-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install required algorithms
        run: python -m pip install numpy pillow brotli
      - name: Syntax, int16 wraparound and vectorized varint tests
        run: |
          python -m py_compile research/universe/experiment_58_vectorized_decoder.py
          python research/universe/experiment_58_vectorized_decoder.py --self-test
      - name: Compare all 20 real indexed terrain configurations
        run: |
          python research/universe/experiment_58_vectorized_decoder.py \
            --out /tmp/blkh_exp58
      - name: Verify archived bytes, ROI timing and losslessness
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,sys,numpy as np
          sys.path.insert(0,"research/universe")
          from experiment_58_vectorized_decoder import decode_indexed,roi_from_file
          from experiment_56_reversible_dem import CORE,HELDOUT,source_hgt
          from experiment_57_random_access_dem import source_cases
          root=pathlib.Path("/tmp/blkh_exp58")
          rows=json.loads((root/"results.json").read_text())["records"]
          assert len(rows)==20
          assert {x["region"] for x in rows}==set(CORE+HELDOUT)
          for region in CORE+HELDOUT:
              raw,_=source_hgt(region,pathlib.Path("/tmp/blkh_exp56_skadi_cache"))
              reference=dict(source_cases(raw))
              rr=[x for x in rows if x["region"]==region]
              assert len(rr)==5
              for x in rr:
                  image=reference[x["case"]]
                  blob=(root/x["file"]).read_bytes()
                  assert hashlib.sha256(blob).hexdigest()==x["vectorized_sha256"]
                  assert np.array_equal(decode_indexed(blob),image)
                  assert x["lossless_all_modes"]
                  assert x["vectorized_roi_fraction_read"]<1.0
                  for mode in ("bh56","j2k","vectorized"):
                      assert x["bytes"][mode]>0
                      assert x["roi_time_seconds_median"][mode]>0
                  assert x["bytes"]["vectorized"]==len(blob)
                  p=root/x["file"]
                  b,accessed=roi_from_file(p,0,0)
                  s=x["block_side"]
                  assert np.array_equal(b,image[:s,:s])
                  assert accessed < len(blob)
          print("EXP58: 20/20 EXACT LOSSLESS, REAL PHYSICAL ROI READS, MATCHED BASELINES")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp58-vectorized-roi
          path: /tmp/blkh_exp58/
          retention-days: 30
