name: exp54 real elevation meter-error validation

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/universe/experiment_54_srtm_real_meters.py"
      - ".github/workflows/exp54.yml"
      - "research/universe/experiment_51_fair_sharing.py"
  pull_request:
    branches: [main]
    paths:
      - "research/universe/experiment_54_srtm_real_meters.py"
      - ".github/workflows/exp54.yml"
  workflow_dispatch:

jobs:
  real-dem:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch pillow scikit-learn scikit-image
      - name: Syntax and lossless/predictive round-trip checks
        run: |
          python -m py_compile research/universe/experiment_54_srtm_real_meters.py
          python research/universe/experiment_54_srtm_real_meters.py --self-test
      - name: Download public real DEMs and run paired codec comparisons
        run: |
          python research/universe/experiment_54_srtm_real_meters.py \
            --regions N37W122,N37W119 \
            --epochs 300 --seeds 42,123 --width 16 \
            --out /tmp/blkh_exp54_real_dem
      - name: Validate measured byte counts, terrain errors and provenance
        run: |
          python - <<'PY'
          import hashlib, json, math, pathlib
          root = pathlib.Path("/tmp/blkh_exp54_real_dem")
          report = json.loads((root / "results.json").read_text())
          assert len(report["regions"]) == 2
          for region in report["regions"]:
              name = region["source"]["hgt_tile_id"]
              assert region["height_unit"] == "meter"
              assert len(region["neural"]) == 4
              assert len(region["classical"]) == 16
              assert region["height_max_m"] > region["height_min_m"]
              assert region["source"]["decompressed_sha256"]
              for pt in region["neural"] + region["classical"]:
                  path = root / name / pt["file"]
                  raw = path.read_bytes()
                  assert len(raw) == pt["bytes"]
                  assert hashlib.sha256(raw).hexdigest() == pt["sha256"]
                  assert pt["post_decode_verified"]
                  assert all(math.isfinite(pt[key]) for key in
                             ("rmse_m", "max_abs_error_m", "p95_abs_error_m",
                              "global_psnr_db"))
                  assert pt["max_abs_error_m"] >= pt["rmse_m"]
              perfect = [p for p in region["classical"] if "lossless" in p["method"]]
              assert len(perfect) == 2
              assert all(p["rmse_m"] == 0.0 for p in perfect)
              print(name, "range_m=", region["height_max_m"]-region["height_min_m"])
              for p in region["neural"]:
                  print(p["method"],p["seed"],p["bytes"],p["rmse_m"],
                        "dominated=",bool(p["dominated_by_classical"]))
              for p in region["classical"]:
                  print(p["method"],p.get("quality",p.get("quantization_step_m","")),
                        p["bytes"],p["rmse_m"])
          print("EXP54 REAL DEM VALIDATION PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp54-real-dem-artifacts
          path: /tmp/blkh_exp54_real_dem/
          retention-days: 14
