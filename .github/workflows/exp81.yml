name: exp81 original Git-authored PNG sprite revisions exact RGBA

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/dedup/experiment_81_real_git_png_revisions.py"
      - "research/dedup/BHUH_EXP81_REAL_GIT_REVISIONS_PROTOCOL.md"
      - ".github/workflows/exp81.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/dedup/experiment_81_real_git_png_revisions.py"
      - ".github/workflows/exp81.yml"
  workflow_dispatch:

jobs:
  original-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: 1
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact lossless image and Zstandard comparators
        run: python -m pip install "numpy<3" "pillow>=11.2" zstandard
      - name: Syntax and eight exact source-version codec self-tests
        run: |
          python -m py_compile research/dedup/experiment_81_real_git_png_revisions.py
          python research/dedup/experiment_81_real_git_png_revisions.py --self-test
      - name: Clone pinned CC0 open-game-art history and test genuine edited PNGs
        run: |
          python research/dedup/experiment_81_real_git_png_revisions.py \
            --out /tmp/blkh_exp81 --source-cache /tmp/blkh_exp81_source
      - name: Independently decode and recheck original historical Git blobs
        run: |
          python - <<'PY'
          import json,pathlib,sys,hashlib,numpy as np
          sys.path.insert(0,"research/dedup")
          from experiment_81_real_git_png_revisions import (
              SOURCE_HEAD,SOURCE_PAGE,MODES,PREFERRED_PREFIXES,
              get_clone,scan,manifest_for,decode_case,sha
          )
          root=pathlib.Path("/tmp/blkh_exp81")
          report=json.loads((root/"results.json").read_text())
          assert report["experiment"]==81
          assert report["source_repo"]==SOURCE_PAGE
          assert report["pinned_head_commit"]==SOURCE_HEAD
          clone=get_clone(pathlib.Path("/tmp/blkh_exp81_source"))
          candidates,inventory=scan(clone,root)
          assert len(candidates)==report["source_audit_sample_count"]
          lengths=[n for n in PREFERRED_PREFIXES if n<=len(candidates)]
          if not lengths:lengths=[len(candidates)]
          assert report["evaluation_prefixes"]==lengths
          assert len(report["results"])==len(lengths)
          for row in report["results"]:
              n=row["historically_edited_png_pairs"]
              assert n in lengths
              items=candidates[:n]
              manifest=manifest_for(items)
              assert row["manifest"]==manifest
              assert row["all_original_rgba_exact"]
              assert set(row["codec_archives"])==set(MODES)
              folder=root/f"pairs_{n:02d}"
              for mode,entry in row["codec_archives"].items():
                  contents=(folder/entry["file"]).read_bytes()
                  assert len(contents)==entry["bytes"]
                  assert hashlib.sha256(contents).hexdigest()==entry["sha256"]
                  assert entry["encode_seconds"]>0 and entry["decode_seconds"]>0
                  sprites,meta=decode_case(contents)
                  assert meta=={**manifest,"codec":mode}
                  assert len(sprites)==n*2
                  for i,pair in enumerate(items):
                      assert np.array_equal(sprites[2*i],pair["before"])
                      assert np.array_equal(sprites[2*i+1],pair["after"])
                      assert sha(sprites[2*i].tobytes())==pair["meta"]["before_rgba_sha256"]
                      assert sha(sprites[2*i+1].tobytes())==pair["meta"]["after_rgba_sha256"]
              smallest,method=min((v["bytes"],k)
                  for k,v in row["codec_archives"].items() if k in MODES[:4])
              baseline,reference=min((v["bytes"],k)
                  for k,v in row["codec_archives"].items() if k in MODES[4:])
              assert (smallest,method)==(row["best_delta_bytes"],row["best_delta_codec"])
              assert (baseline,reference)==(
                  row["best_conventional_bytes"],row["best_conventional_codec"])
              assert row["delta_smaller_than_strongest_reference"]==(smallest<baseline)
              print("EXP81 VERIFIED historical PNG pairs",n,"best new",method,smallest,
                    "best true original reference",reference,baseline)
          print("EXP81 PASS: original Git commits and blobs re-read; all saved modified RGBA sprites/byte hashes independently reconstructed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp81-original-git-png-revision-differences
          path: /tmp/blkh_exp81/
          retention-days: 30
