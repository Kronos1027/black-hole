name: exp61 warm GeoTIFF vs BH60 ROI

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/universe/experiment_61_warm_geotiff.py"
      - ".github/workflows/exp61.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/universe/experiment_61_warm_geotiff.py"
      - ".github/workflows/exp61.yml"
  workflow_dispatch:

jobs:
  warmed-roi:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: GDAL/Rasterio dependencies
        run: python -m pip install numpy pillow brotli rasterio
      - name: Check code and run warm-file-handle benchmark
        run: |
          python -m py_compile research/universe/experiment_61_warm_geotiff.py
          python research/universe/experiment_61_warm_geotiff.py \
            --repeats 5 --out /tmp/blkh_exp61
      - name: Verify source, complete files and controlled warm measurements
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,numpy as np, rasterio,sys
          sys.path.insert(0,"research/universe")
          from experiment_60_geotiff_roi import REGIONS,CODECS,bh60_decode_full
          from experiment_61_warm_geotiff import N_ROIS
          root=pathlib.Path("/tmp/blkh_exp61")
          report=json.loads((root/"results.json").read_text())
          rows=report["records"]
          assert len(rows)==12
          assert set(report["regions"])==set(REGIONS)
          for r in rows:
              assert r["lossless_verified"] and r["max_error_m"]==0
              assert len(r["roi_positions"])==N_ROIS
              assert r["samples_per_mode"]==N_ROIS*5
              d=root/r["region"]/r["case"]
              original,meta=bh60_decode_full(d/r["codec_file"]["bh60"])
              assert hashlib.sha256(original.tobytes()).hexdigest()==r["input_sha256"]
              for codec in CODECS:
                  f=d/r["codec_file"][codec]
                  blob=f.read_bytes()
                  assert len(blob)==r["codec_sizes"][codec]
                  assert hashlib.sha256(blob).hexdigest()==r["codec_sha256"][codec]
                  assert 0<r["median_ms"][codec] and r["p95_ms"][codec]>0
                  if codec!="bh60":
                      with rasterio.open(f) as ds:
                          assert np.array_equal(ds.read(1),original)
                          assert ds.crs.to_string()=="EPSG:4326"
                          assert ds.block_shapes[0]==(32,32)
              print(r["region"],r["case"],"warm_ms",r["median_ms"])
          print("EXP61 VERIFIED: 12 WARM OPEN-DATASET BENCHMARKS, EXACT DEM")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp61-warm-handle-geotiff
          path: /tmp/blkh_exp61/
          retention-days: 30
