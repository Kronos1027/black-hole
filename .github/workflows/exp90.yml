name: exp90 decoder-minimal vs complete provenance exact RGBA 448 archive independent audit

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/dedup/experiment_90_minimal_decoder_metadata.py"
      - "research/dedup/BHUH_EXP90_DECODER_MINIMAL_METADATA_PROTOCOL.md"
      - ".github/workflows/exp90.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/dedup/experiment_90_minimal_decoder_metadata.py"
      - ".github/workflows/exp90.yml"
  workflow_dispatch:

jobs:
  audited-minimal-decoder-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original exact-lossless 14-codec dependencies
        run: python -m pip install "numpy<3" "pillow>=11.2" zstandard bsdiff4
      - name: Compile and self-test all decoder-minimal method manifests
        run: |
          python -m py_compile research/dedup/experiment_90_minimal_decoder_metadata.py
          python research/dedup/experiment_90_minimal_decoder_metadata.py --self-test
      - name: Regenerate historical real Git PNG data, 112 old plus 336 full and lean archives
        run: python research/dedup/experiment_90_minimal_decoder_metadata.py --out /tmp/blkh_exp90
      - name: Independently re-open and verify all 448 archival byte files, frozen sources and rankings
        run: |
          python - <<'PY'
          import json, pathlib, sys, urllib.request
          import numpy as np
          sys.path.insert(0, "research/dedup")
          import experiment_83_pixelorama_git_history as legacy
          import experiment_84_sparse_pixel_patches as sparse
          import experiment_89_metadata_envelope as earlier
          import experiment_90_minimal_decoder_metadata as exp90

          root = pathlib.Path("/tmp/blkh_exp90")
          report = json.loads((root/"results.json").read_text())
          assert report["experiment"] == 90 and report["known_previously_studied_source_populations"]
          assert report["methods"] == list(sparse.ALL) and len(sparse.ALL) == 14
          assert report["arms"] == list(exp90.VALID_MODES)
          assert len(report["datasets"]) == 2
          old_files = treatment_files = pngs = 0
          for spec, ds in zip(earlier.DATASETS, report["datasets"]):
              label, source_exp, complete, count, expected_images = spec
              assert ds["dataset"] == label and ds["source_original_png_pairs"] == count
              assert len(ds["cases"]) == 4
              folder = root/label
              source_exp.configure_sources()
              sources, inventory = source_exp.discover(folder)
              assert len(sources) == expected_images and ds["source_inventory"] == inventory
              groups = {complete: sources}
              for group, sha, paths in source_exp.SOURCE_GROUPS:
                  parent = source_exp.first_parent(sha)
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{source_exp.SOURCE_REPO}/compare/{parent}...{sha}",
                      headers={"User-Agent": "BLKH-exp90-independent-source-audit"})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      comparison = json.load(response)
                  modified = {x["filename"] for x in comparison["files"] if x["status"]=="modified"}
                  assert set(paths).issubset(modified), (group, set(paths)-modified)
                  groups[group] = [x for x in sources if x["meta"]["commit_label"] == group]
                  assert len(groups[group]) == 2*len(paths)
                  for index, path in enumerate(paths):
                      for role, ref in (("old",parent),("new",sha)):
                          fresh, rgba = legacy.source_png(ref,path)
                          recorded = (folder/"sources"/f"{group}_{index:02d}_{role}.png").read_bytes()
                          assert fresh == recorded
                          matched = [x for x in groups[group]
                                     if x["meta"]["file_path"] == path and x["meta"]["role"] == role]
                          assert len(matched) == 1
                          assert exp90.sha(fresh) == matched[0]["meta"]["source_png_sha256"]
                          assert np.array_equal(rgba,matched[0]["rgba"])
                          pngs += 1

              for case in ds["cases"]:
                  group = case["group"]
                  originals = groups[group]
                  assert len(originals) == 2 * case["pair_count"]
                  assert set(case["files"]) == set(sparse.ALL)
                  observed = {}
                  originals_per_codec = {}
                  for method, entry in case["files"].items():
                      original = (folder/group/entry["original_filename"]).read_bytes()
                      assert len(original) == entry["original_bytes"]
                      assert exp90.sha(original) == entry["original_sha256"]
                      magic, full_raw, unchanged_payload = earlier.parse_original(original)
                      full = json.loads(full_raw)
                      assert full["codec"] == method
                      assert magic.decode() == entry["original_magic"]
                      assert len(full_raw) == entry["original_full_manifest_bytes"]
                      assert len(unchanged_payload) == entry["source_image_payload_bytes"]
                      images, old_meta = earlier.decode_original(original,method)
                      assert len(images) == len(originals)
                      assert all(np.array_equal(p, s["rgba"]) for p,s in zip(images,originals))
                      old_files += 1
                      originals_per_codec[method] = len(original)
                      observed[method] = {}
                      for arm in ("full_zstd","lean_raw","lean_zstd"):
                          item = entry["flavors"][arm]
                          stream = (folder/group/item["filename"]).read_bytes()
                          assert len(stream) == item["bytes"] and exp90.sha(stream) == item["sha256"]
                          restored = earlier.unrewrap(stream) if arm != "lean_raw" else stream
                          old_magic, small_raw, saved_payload = earlier.parse_original(restored)
                          assert old_magic == magic and saved_payload == unchanged_payload
                          assert exp90.sha(saved_payload) == item["original_codec_payload_sha256"]
                          assert exp90.sha(restored) == item["restored_archive_sha256"]
                          if arm == "full_zstd":
                              assert restored == original
                              assert json.loads(small_raw) == full
                          else:
                              small = json.loads(small_raw)
                              assert len(small_raw) == entry["lean_required_manifest_bytes"]
                              assert small["codec"] == method
                              required = {"codec","atlas_shape","atlas_sha256","source_sprites"}
                              if method in legacy.ALL_METHODS:
                                  required |= {"source_png_count","historical_pair_count"}
                              if method == "sparse_webpold_zstd":
                                  required |= {"old_atlas_shape","old_atlas_rgba_sha256","old_atlas_positions"}
                              assert set(small) == required
                              assert len(small["source_sprites"]) == len(originals)
                              for i,spr in enumerate(small["source_sprites"]):
                                  required_spr = {"x","y","width","height","pixel_rgba_sha256"}
                                  if (method in ("original_png_zstd",sparse.BINARY) or
                                      (method == "sparse_pngold_zstd" and i%2 == 0)):
                                      required_spr.add("source_png_sha256")
                                  assert set(spr) == required_spr
                                  for k in required_spr:
                                      assert spr[k] == full["source_sprites"][i][k]
                              if method == "sparse_webpold_zstd":
                                  assert small["old_atlas_shape"] == full["old_atlas_shape"]
                                  assert small["old_atlas_rgba_sha256"] == full["old_atlas_rgba_sha256"]
                                  assert small["old_atlas_positions"] == [
                                      {k: p[k] for k in ("x","y","width","height")}
                                      for p in full["old_atlas_positions"]]
                          decoded, meta = earlier.decode_original(restored,method)
                          assert all(np.array_equal(a,b["rgba"]) for a,b in zip(decoded,originals))
                          assert item["whole_archive_is_decodable_to_exact_rgba"]
                          observed[method][arm] = len(stream)
                          treatment_files += 1
                  for arm in exp90.VALID_MODES:
                      best_sparse = min((observed[m][arm],m) for m in sparse.NEW)
                      best_ref = min((observed[m][arm],m)
                                     for m in (sparse.BINARY,)+sparse.OLD)
                      rank = case["arm_rankings"][arm]
                      assert tuple(rank["best_sparse"]) == best_sparse
                      assert tuple(rank["best_reference"]) == best_ref
                      assert rank["sparse_strict_win"] == (best_sparse[0]<best_ref[0])
                  assert tuple(case["original_best_sparse"]) == min(
                      (originals_per_codec[m],m) for m in sparse.NEW)
                  assert tuple(case["original_best_reference"]) == min(
                      (originals_per_codec[m],m) for m in (sparse.BINARY,)+sparse.OLD)
                  print("EXP90 INDEPENDENT AUDIT", label,group,
                        {x:(case["arm_rankings"][x]["best_sparse"],
                            case["arm_rankings"][x]["best_reference"]) for x in exp90.VALID_MODES},
                        flush=True)
              aggregate = ds["cases"][0]
              savings = sum(aggregate["files"][m]["flavors"]["lean_raw"]["bytes"] <
                            aggregate["files"][m]["original_bytes"] for m in sparse.ALL)
              assert savings >= 10, (label,savings)
              print("EXP90 HEADERS",label,"lean smaller than original",savings,"of 14",flush=True)
              if label == "exp87_wesnoth":
                  assert aggregate["original_best_sparse"][0] == 64802
                  assert aggregate["original_best_reference"][0] == 65259
              else:
                  assert aggregate["original_best_sparse"][0] == 430620
                  assert aggregate["original_best_reference"][0] == 374887
          assert old_files == 112 and treatment_files == 336 and pngs == 100
          print("EXP90 INDEPENDENT VERIFICATION PASSED:",old_files,
                "original archives,",treatment_files,"repacked/minimal archives,",
                pngs,"original immutable PNG bytes; pixel-decode exact",flush=True)
          PY
      - name: Upload full exact original images, lean and full archives and audited metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp90-full-vs-decoder-minimal-448-self-contained-archives
          path: /tmp/blkh_exp90/
          retention-days: 30
