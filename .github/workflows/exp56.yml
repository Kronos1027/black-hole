name: exp56 lossless heldout DEM scientific check

on:
  push:
    branches: [research/exp51-fair-shared-siren]
    paths:
      - "research/universe/experiment_56_reversible_dem.py"
      - "research/universe/experiment_56b_competing_codecs.py"
      - ".github/workflows/exp56.yml"
  pull_request:
    branches: [main]
    paths:
      - "research/universe/experiment_56_reversible_dem.py"
      - "research/universe/experiment_56b_competing_codecs.py"
      - ".github/workflows/exp56.yml"
  workflow_dispatch:

jobs:
  exp56:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal codec runtime
        run: |
          python -m pip install numpy pillow brotli
      - name: Verify syntax, lossless decoding and invalid-input rejection
        run: |
          python -m py_compile research/universe/experiment_56_reversible_dem.py
          python research/universe/experiment_56_reversible_dem.py --self-test
      - name: Run real SRTM-derived DEM, including two new held-out geographic regions
        run: |
          python research/universe/experiment_56_reversible_dem.py \
            --out /tmp/blkh_exp56_real_hgt
      - name: Independently verify every artifact from its encoded bytes
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          import numpy as np
          sys.path.insert(0, "research/universe")
          from experiment_56_reversible_dem import decode, source_hgt, tile_cases, CORE, HELDOUT
          root = pathlib.Path("/tmp/blkh_exp56_real_hgt")
          result = json.loads((root / "results.json").read_text())
          records = result["records"]
          assert len(records) == 16, len(records)
          assert {r["region"] for r in records} == set(CORE + HELDOUT)
          for region in CORE + HELDOUT:
              hgt, source = source_hgt(region, pathlib.Path("/tmp/blkh_exp56_skadi_cache"))
              original = dict(tile_cases(hgt))
              rows = [r for r in records if r["region"] == region]
              assert len(rows) == 4
              for row in rows:
                  raw = (root / row["file"]).read_bytes()
                  assert len(raw) == row["bytes"]
                  assert hashlib.sha256(raw).hexdigest() == row["encoded_sha256"]
                  a = decode(raw)
                  b = original[row["case"]]
                  assert np.array_equal(a, b)
                  assert row["max_abs_error_m"] == 0
                  assert row["heldout_geographic_region"] == (region in HELDOUT)
                  print(region, row["case"], "PNG", row["png16_bytes"],
                        "BH56", row["bytes"], "saving%", round(row["saving_vs_png16_percent"], 2))
          print("EXP56: VERIFIED 16/16 EXACT LOSSLESS ROUNDTRIPS, INCLUDING HELD-OUT DATA")
          PY
      - name: Real lossless PNG-opt and JPEG2000 baselines
        run: |
          python -m py_compile research/universe/experiment_56b_competing_codecs.py
          python research/universe/experiment_56b_competing_codecs.py \
            --cache /tmp/blkh_exp56_skadi_cache \
            --out /tmp/blkh_exp56_rigorous --repeats 3
          python - <<'PY'
          import json,pathlib,math
          root=pathlib.Path("/tmp/blkh_exp56_rigorous")
          j=json.loads((root/"results.json").read_text())
          assert len(j["records"])==16
          assert sum(x["heldout_region"] for x in j["records"])==8
          for x in j["records"]:
              assert x["lossless_verified"]
              assert x["max_error_meters"]==0
              assert all(math.isfinite(x[k]) and x[k]>0 for k in
                 ("encode_seconds_median","decode_seconds_median"))
              assert min(x["png16_optimized_bytes"],x["j2k_lossless_bytes"])>0
          print("EXP56B: 16/16 verified lossless, honest stronger codecs")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp56-decoded-lossless-terrain
          path: |
            /tmp/blkh_exp56_real_hgt/
            /tmp/blkh_exp56_rigorous/
          retention-days: 30
